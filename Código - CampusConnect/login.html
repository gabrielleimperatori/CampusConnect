<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://vlibras.gov.br">
    <script src="arquivo.js"></script>
</head>
<body>
     
    <div class="header">
        <header>
          <div class="bloco">
              <div class="logo">
                  <img src="imagens/logo.png" width="100" height="100">
              </div>
              <div class="nome"><h1>CampusConnect</h1></div>
          </div>
          <nav>
           <a href="login.html">Login</a>
       </header> 
    </div>

     <div class="container">
     
        <form id="loginform" onsubmit="return enviarLogin(event)">
     
            <h1 class="h1-login">Login</h1>
     
            <label for="email"> E-mail: </label>
     
            <input type="text" id="email" placeholder="exemplo@emxemplo.com.br"/>
     
        
     
            <br>
     
           <label for="password"> Senha: </label>
     
            <input type="password" id="password" placeholder="Digite sua senha" />
     
            <input type="button" id="showPassword"  value="Mostrar" class="button"/>
     
            <div id="mostra"> </div>
            <input type="submit" value="Entrar" class="button"/>

            <p>Não é cadastrado? <a href="cadastro.html">cadastre-se!</a></p>
     
             </form>
     
             </div>
     
             <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js"> </script>
     
             <script  src="validasenha.js"> </script>
     
             <script>
     
            $(document).ready(function() {
     
            $('#showPassword').on('click', function () {
     
             const passwordField = $('#password');
     
            const type = passwordField.attr('type') === 'password' ? 'text' : 'password';
     
            passwordField.attr('type', type);
     
          $(this).val(type === 'password' ? 'Mostrar' : 'Esconder');
    });
     
    });
     
    </script>
     
            </script>
    <hr>     
</body>
</html>
